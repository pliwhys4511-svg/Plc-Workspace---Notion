name: Verify Firebase Shared Workspace Rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.mjs'
      - 'firebase.rules-test.json'
      - '.github/workflows/verify-firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and rules test SDK
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --legacy-peer-deps --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5
      - name: Test actual Firestore authorization rules
        run: npx firebase emulators:exec --project demo-plc-shared-workspace --config firebase.rules-test.json --only firestore "node --test tests/firestore.rules.test.mjs"
