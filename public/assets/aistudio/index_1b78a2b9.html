<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLC Workspace — Notion Offline</title>
<link rel="stylesheet" href="app.css">
<script>
  // Applied before first paint so dark mode never flashes white.
  try {
    var t = JSON.parse(localStorage.getItem('plc.notion.v2') || 'null');
    if (t && t.theme) document.documentElement.dataset.theme = t.theme;
  } catch (e) {}
</script>
</head>
<body>

<aside id="sidebar" aria-label="Sidebar"></aside>

<div id="main" class="main">
  <header id="topbar" class="topbar" aria-label="Page top bar"></header>
  <div id="scroll" class="scroll">
    <div id="page" class="page-col"></div>
  </div>
</div>

<div id="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="storage-warn" class="storage-warn" hidden></div>

<script src="js/store.js"></script>
<script src="js/blocks.js"></script>
<script src="js/database.js"></script>
<script src="js/ops.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
